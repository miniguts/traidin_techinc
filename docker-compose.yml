services:
  # 1. Nginx: отдаёт собственный HTML/CSS-сайт и проксирует /api/ в backend
  web:
    build:
      context: ./web
    container_name: ${COMPOSE_PROJECT_NAME}-web
    environment:                    # переменные берутся из .env
      API_HOST: api
      API_PORT: ${API_PORT}
    ports:
      - "${WEB_PORT}:80"            # проброс порта: хост -> контейнер
    volumes:
      - web_logs:/var/log/nginx     # логи nginx сохраняются в volume
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped

  # 2. API на Python/Flask: счётчик посещений и гостевая книга
  api:
    build:
      context: ./api
    container_name: ${COMPOSE_PROJECT_NAME}-api
    environment:                    # переменные берутся из .env
      API_PORT: ${API_PORT}
      APP_ENV: ${APP_ENV}
      SITE_TITLE: ${SITE_TITLE}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "${API_PORT}"               # доступен только внутри docker-сети
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen('http://localhost:'+os.environ['API_PORT']+'/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # 3. Redis: хранилище данных (persist на volume)
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--port", "${REDIS_PORT}"]
    volumes:
      - redis_data:/data            # данные переживают пересоздание контейнера
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_PORT} -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:                         # web <-> api
    driver: bridge
  backend:                          # api <-> redis, без выхода наружу
    driver: bridge
    internal: true

volumes:
  redis_data:
  web_logs:
